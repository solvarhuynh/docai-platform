[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docai"
version = "0.1.0"
description = "Small FastAPI service with Classic and VLM document processing tracks."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Solvar Huynh" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.28.0", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
where = ["backend/shared/src", "backend/track-a/src", "backend/track-b/src"]
include = ["docai*"]
