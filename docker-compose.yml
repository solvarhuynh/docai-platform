services:
  api:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.10-slim
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir -e ".[api]"
        CMD ["uvicorn", "docai.shared.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    container_name: docai_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=development
    restart: unless-stopped
